<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INJECTRIX v3 — Console Arsenal · Automation · mXSS · Reports</title>
<style>
:root{--bg:#0a0c10;--bg2:#0f1218;--panel:#14181f;--panel2:#1a1f29;--border:#232a36;--txt:#c8d3e0;--dim:#6b7889;--acc:#4af0c0;--acc2:#4a9df0;--warn:#f0b44a;--danger:#f05a6e;--ok:#6ef07a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:17px;font-weight:700;letter-spacing:3px;color:var(--acc)}.logo span{color:var(--acc2)}
.tagline{font-size:11px;color:var(--dim)}
.search-wrap{flex:1;min-width:180px;max-width:400px;position:relative}
#search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:7px 12px 7px 30px;border-radius:6px;font-family:inherit;font-size:13px;outline:none}
#search:focus{border-color:var(--acc)}
.search-wrap::before{content:'⌕';position:absolute;left:9px;top:6px;color:var(--dim);font-size:15px}
#modeBtn{background:transparent;border:1px solid var(--border);color:var(--dim);padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px}
#modeBtn:hover{color:var(--acc);border-color:var(--acc)}
main{flex:1;display:flex;overflow:hidden}
aside{width:190px;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto;padding:10px 0;flex-shrink:0}
.cat{padding:7px 14px;cursor:pointer;color:var(--dim);border-left:3px solid transparent;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cat:hover{color:var(--txt);background:var(--panel)}
.cat.active{color:var(--acc);border-left-color:var(--acc);background:var(--panel)}
.cat .count{font-size:10px;background:var(--panel2);padding:1px 7px;border-radius:10px}
.cat.active .count{background:var(--acc);color:#000}
#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.card:hover{border-color:var(--acc2)}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.card-title{font-weight:700;font-size:13px;color:#e8eef5}
.badge{font-size:9px;padding:2px 8px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.b-read{background:rgba(74,157,240,.15);color:var(--acc2);border:1px solid rgba(74,157,240,.3)}
.b-instr{background:rgba(110,240,122,.12);color:var(--ok);border:1px solid rgba(110,240,122,.3)}
.b-active{background:rgba(240,180,74,.12);color:var(--warn);border:1px solid rgba(240,180,74,.3)}
.b-payload{background:rgba(240,90,110,.12);color:var(--danger);border:1px solid rgba(240,90,110,.3)}
.b-util{background:rgba(160,120,240,.15);color:#b490f0;border:1px solid rgba(160,120,240,.3)}
.cat-tag{font-size:10px;color:var(--dim)}
.card-desc{color:var(--dim);font-size:12px;margin-bottom:8px;line-height:1.5}
.code-block{background:#080a0e;border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:11px;line-height:1.6;overflow:auto;white-space:pre;color:#9fb2c8;max-height:200px}
.card-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
button.act{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:4px 11px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px}
button.act:hover{border-color:var(--acc);color:var(--acc)}
button.act.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
button.act.primary:hover{opacity:.85;color:#000}
button.act.cap{border-color:rgba(74,240,192,.4);color:var(--acc)}
#builder{width:360px;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0}
.panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.panel-tabs div{flex:1;text-align:center;padding:10px;cursor:pointer;font-size:11px;letter-spacing:2px;color:var(--dim);border-bottom:2px solid transparent}
.panel-tabs div.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab-pane{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-pane.active{display:flex}
#builderList{flex:1;overflow-y:auto;padding:10px}
.b-item{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 9px;margin-bottom:7px;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:5px}
.b-item .t{color:#e8eef5;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-item button{background:none;border:none;color:var(--dim);cursor:pointer;font-family:inherit;font-size:12px;padding:2px 3px}
.b-item button:hover{color:var(--danger)}
.b-item button.up:hover{color:var(--acc)}
.empty{color:var(--dim);text-align:center;padding:18px;font-size:11px;line-height:1.7}
#builderActions{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
#builderActions button,#reportActions button{width:100%;padding:8px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
#exportBtn{background:var(--acc);border:none;color:#000}
#bmBtn{background:var(--panel2);border:1px solid var(--border);color:var(--acc2)}
#clearBtn,#clearRepBtn{background:transparent;border:1px solid var(--border);color:var(--dim)}
#builderPreview{background:#080a0e;border:1px solid var(--border);border-radius:6px;margin:0 10px 10px;padding:9px;font-size:10px;height:130px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#7a8ba0}
/* report tab */
#reportPane{padding:12px;overflow-y:auto;flex:1}
#repIn{width:100%;height:110px;background:#080a0e;border:1px solid var(--border);border-radius:6px;color:var(--txt);padding:9px;font-family:inherit;font-size:11px;resize:vertical;outline:none}
#repIn:focus{border-color:var(--acc)}
.rep-meta{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:11px;color:var(--dim);margin:10px 0;line-height:1.7;word-break:break-all}
.rep-meta b{color:var(--txt)}
.finding{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px}
.f-head{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.f-title{font-weight:700;font-size:12px;color:#e8eef5;flex:1}
.f-time{font-size:10px;color:var(--dim)}
.f-data{background:#080a0e;border-radius:4px;padding:7px;font-size:10px;color:#9fb2c8;white-space:pre-wrap;word-break:break-word;max-height:130px;overflow:auto;margin-bottom:6px}
.f-note{width:100%;background:#080a0e;border:1px solid var(--border);border-radius:4px;color:var(--warn);padding:6px;font-family:inherit;font-size:11px;outline:none}
.f-note:focus{border-color:var(--warn)}
.sev-select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:4px;padding:3px 6px;font-family:inherit;font-size:10px;cursor:pointer}
#reportActions{padding:10px 0 0;display:flex;flex-direction:column;gap:7px}
#savedReports{margin-top:10px}
.sv-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:11px}
.sv-item .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;cursor:pointer}
.sv-item .t:hover{color:var(--acc)}
.sv-item button{background:none;border:none;color:var(--dim);cursor:pointer;font-family:inherit}
.sv-item button:hover{color:var(--danger)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--acc);color:#000;padding:9px 22px;border-radius:6px;font-weight:700;font-size:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:900px){aside{display:none}#builder{width:300px}}
</style>
</head>
<body>
<header>
  <div class="logo">INJECTRIX<span>_v3</span></div>
  <div class="tagline">console arsenal // recon → execute → automate → report</div>
  <div class="search-wrap"><input id="search" placeholder="search 67 snippets… (try 'jwt', 'pp', 'cache')"></div>
  <button id="modeBtn">risk: ALL</button>
</header>
<main>
  <aside id="cats"></aside>
  <div id="list"></div>
  <div id="builder">
    <div class="panel-tabs">
      <div id="tabMission" class="active" onclick="switchTab('mission')">MISSION</div>
      <div id="tabReport" onclick="switchTab('report')">REPORT</div>
    </div>
    <div id="missionPane" class="tab-pane active">
      <div style="padding:10px;border-bottom:1px solid var(--border)">
        <div style="font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:6px">MISSION TEMPLATES</div>
        <div style="display:flex;gap:6px">
          <select id="tplSelect" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:5px;padding:6px;font-family:inherit;font-size:11px"></select>
          <button class="act" style="padding:6px 12px" onclick="loadTemplate()">load</button>
        </div>
      </div>
      <div id="builderList"><div class="empty">queue snippets to chain them<br>bootstrap auto-injects · steps auto-capture</div></div>
      <div id="builderPreview"></div>
      <div id="builderActions">
        <button id="exportBtn">⧉ COPY CHAINED PAYLOAD</button>
        <button id="bmBtn">⛓ COPY AS BOOKMARKLET</button>
        <button id="clearBtn">clear</button>
      </div>
    </div>
    <div id="reportPane" class="tab-pane">
      <div id="reportPaneInner" style="display:flex;flex-direction:column;flex:1;overflow:hidden;width:100%">
        <textarea id="repIn" placeholder="paste __IRX.export() JSON from the target console…"></textarea>
        <div id="reportActions">
          <button id="loadRepBtn" style="background:var(--acc2);border:none;color:#000">↓ LOAD REPORT</button>
          <button id="saveRepBtn" style="background:var(--panel2);border:1px solid var(--border);color:var(--acc)">💾 SAVE TO LIBRARY</button>
          <button id="expMdBtn" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt)">⧉ EXPORT MARKDOWN</button>
          <button id="expHtmlBtn" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt)">⧉ EXPORT STANDALONE HTML</button>
          <button id="expJsonBtn" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt)">⧉ EXPORT JSON</button>
        </div>
        <div id="repMeta" class="rep-meta" style="display:none"></div>
        <div id="findings" style="flex:1;overflow-y:auto;margin-top:4px"></div>
        <div class="rep-meta" style="margin-top:10px">saved reports</div>
        <div id="savedReports" style="max-height:120px;overflow-y:auto"></div>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
const SNIPPETS = [{"id": "zz-irx-bootstrap", "cat": "Report", "title": "IRX Bootstrap \u2014 Report Engine", "desc": "INITIALIZE FIRST. Defines window.__IRX in the target page: capture findings, render markdown/HTML reports, copy to clipboard. All captured snippets auto-log through this.", "risk": "utility", "code": "(()=>{if(window.__IRX)return __IRX;const S={meta:{url:location.href,ua:navigator.userAgent,ts:new Date().toISOString()},findings:[]};const irx={log(title,data,severity){S.findings.push({title:String(title),data:typeof data==='string'?data:JSON.stringify(data,null,1),severity:severity||'info',ts:new Date().toISOString().slice(11,19)});console.log('%c[IRX] logged','color:#4af0c0',title);},note(title,text){irx.log(title,text,'note');},export(){return JSON.stringify(S,null,1);},md(){const L=['# INJECTRIX Recon Report','','| Field | Value |','|---|---|','| Target | '+S.meta.url+' |','| Agent | '+S.meta.ua+' |','| Captured | '+S.meta.ts+' |','| Findings | '+S.findings.length+' |','','| # | Time | Severity | Finding |','|---|---|---|---|'];S.findings.forEach((f,i)=>L.push('| '+(i+1)+' | '+f.ts+' | '+f.severity+' | '+f.title.replace(/\\|/g,'/')+' |'));S.findings.forEach((f,i)=>{L.push('','## '+(i+1)+'. '+f.title,'','severity: `'+f.severity+'`  time: `'+f.ts+'`','','```',f.data||'','```');});return L.join('\\n');},html(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;');const rows=S.findings.map((f,i)=>'<tr><td>'+(i+1)+'<\/td><td>'+f.ts+'<\/td><td class=sev-'+f.severity+'>'+f.severity+'<\/td><td><b>'+esc(f.title)+'<\/b><pre>'+esc(f.data||'')+'<\/pre><\/td><\/tr>').join('');return '<!DOCTYPE html><html><head><meta charset=utf-8><title>IRX Report<\/title><style>body{font-family:monospace;background:#0a0c10;color:#c8d3e0;padding:2rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #232a36;padding:8px;vertical-align:top}pre{white-space:pre-wrap;max-width:640px;font-size:11px;color:#9fb2c8}.sev-critical{color:#f05a6e;font-weight:bold}.sev-high{color:#f0b44a}.sev-medium{color:#4a9df0}.sev-info{color:#6ef07a}.sev-note{color:#6b7889}h1{color:#4af0c0}<\/style><\/head><body><h1>INJECTRIX Recon Report<\/h1><p>Target: '+esc(S.meta.url)+'<br>Agent: '+esc(S.meta.ua)+'<br>Captured: '+S.meta.ts+'<\/p><table><tr><th>#<\/th><th>time<\/th><th>sev<\/th><th>finding<\/th><\/tr>'+rows+'<\/table><\/body><\/html>';},copy(){navigator.clipboard.writeText(irx.md()).then(()=>console.log('[IRX] markdown report copied'));},copyHtml(){navigator.clipboard.writeText(irx.html()).then(()=>console.log('[IRX] HTML report copied \u2014 save as .html'));},count:()=>S.findings.length,clear:()=>{S.findings=[];}};window.__IRX=irx;console.log('%c[IRX] report engine ready','color:#4af0c0;font-weight:bold');console.log('  __IRX.log(title,data,sev)  \u2014 capture a finding');console.log('  __IRX.note(title,text)     \u2014 add analyst note');console.log('  __IRX.md() / __IRX.html()  \u2014 render report');console.log('  __IRX.copy() / copyHtml()  \u2014 copy to clipboard');return irx;})()"}, {"id": "enum-scripts", "cat": "Recon", "title": "Enumerate Loaded Scripts", "desc": "List all script srcs, inline count, and cross-origin loads.", "risk": "read-only", "code": "(()=>{const s=[...document.scripts];const ext=s.filter(x=>x.src).map(x=>new URL(x.src).host);return{total:s.length,inline:s.filter(x=>!x.src).length,external:s.filter(x=>x.src).map(x=>x.src),crossOrigin:[...new Set(ext)].filter(h=>h!==location.host)};})()"}, {"id": "enum-meta", "cat": "Recon", "title": "Meta & Comment Harvest", "desc": "Pull meta tags, generator leaks, and HTML comments (often contain debug notes/endpoints).", "risk": "read-only", "code": "(()=>{const m=[...document.querySelectorAll('meta')].map(e=>[e.name||e.property||e.httpEquiv,e.content]).filter(x=>x[1]);const c=[...document.documentElement.innerHTML.matchAll(/<!--([\\s\\S]*?)-->/g)].map(x=>x[1].trim()).filter(x=>x&&x.length<500);const g=[...document.documentElement.innerHTML.matchAll(/(\\/api\\/[a-zA-Z0-9_\\-\\/]+)/g)].map(x=>x[1]);return{meta:m,comments:c.slice(0,50),apiPaths:[...new Set(g)].slice(0,50)};})()"}, {"id": "enum-endpoints", "cat": "Recon", "title": "JS Source Endpoint Extraction", "desc": "Fetch same-origin JS bundles and regex out URL paths, API routes, and secrets.", "risk": "active (requests)", "code": "(async()=>{const out=new Set();for(const s of [...document.scripts].filter(x=>x.src&&new URL(x.src).origin===location.origin)){try{const t=await(await fetch(s.src)).text();for(const m of t.matchAll(/['\"`]((?:\\/[a-zA-Z0-9_\\-\\.]+){2,}\\/?)['\"`]/g))out.add(m[1]);for(const m of t.matchAll(/(https?:\\/\\/[a-zA-Z0-9\\.\\-_]+\\/[a-zA-Z0-9_\\-\\/\\.]+)/g))out.add(m[1]);}catch(e){}}return[...out];})()"}, {"id": "enum-storage", "cat": "Recon", "title": "Full Storage Dump", "desc": "Dump localStorage, sessionStorage, cookies, and IndexedDB database names.", "risk": "read-only", "code": "(async()=>{const ls={},ss={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);ls[k]=localStorage.getItem(k);}for(let i=0;i<sessionStorage.length;i++){const k=sessionStorage.key(i);ss[k]=sessionStorage.getItem(k);}let idb=[];try{idb=(await indexedDB.databases?.()||[]).map(d=>d.name);}catch(e){}return{localStorage:ls,sessionStorage:ss,cookies:document.cookie,indexedDB:idb,cacheKeys:await caches.keys().catch(()=>[])};})()"}, {"id": "enum-frames", "cat": "Recon", "title": "Frame / Window Map", "desc": "Map iframes, their origins, and window.opener relationship (tabnabbing surface).", "risk": "read-only", "code": "(()=>({opener:!!window.opener,openerLocation:(()=>{try{return window.opener?window.opener.location.href:null}catch(e){return'CROSS-ORIGIN (accessible!)'}})(),frames:[...document.querySelectorAll('iframe,frame')].map(f=>({src:f.src,sandbox:f.sandbox?f.sandbox.value:'none',sameOrigin:(()=>{try{return !!f.contentDocument}catch(e){return false}})()})),windows:window.length}))()"}, {"id": "enum-tech", "cat": "Recon", "title": "Framework / Tech Fingerprint", "desc": "Detect React, Vue, Angular, Next.js, jQuery, and global config objects.", "risk": "read-only", "code": "(()=>{const d=()=>{const r={};const check=(name,cond)=>{if(cond)r[name]=true};check('React',!!window.React||!!document.querySelector('[data-reactroot],#root [data-reactid]'));check('ReactDevTools',!!window.__REACT_DEVTOOLS_GLOBAL_HOOK__);check('Vue',!!window.Vue||!!document.querySelector('#app[data-v-], [data-v-app]'));check('VueDevTools',!!window.__VUE__||!!window.__VUE_DEVTOOLS_GLOBAL_HOOK__);check('Next.js',!!window.next||!!document.querySelector('#__next'));check('Nuxt',!!window.__NUXT__);check('Angular',!!window.ng||!!window.angular||!!document.querySelector('[ng-version]'));check('jQuery',!!window.jQuery);check('Svelte',!!document.querySelector('[class*=\"svelte\"]'));check('Ember',!!window.Ember);check('GTM',!!window.google_tag_manager);check('dataLayer',!!window.dataLayer);if(window.__NEXT_DATA__)r.NextData=window.__NEXT_DATA__;if(window.__NUXT__)r.NuxtState=Object.keys(window.__NUXT__);if(window.__INITIAL_STATE__)r.InitialState=Object.keys(window.__INITIAL_STATE__);return r};return d()})()"}, {"id": "enum-sourcemaps", "cat": "Recon", "title": "Source Map Detector", "desc": "Check all loaded scripts for sourceMappingURL and test if the .map is fetchable.", "risk": "active (requests)", "code": "(async()=>{const res=[];for(const s of [...document.scripts].filter(x=>x.src)){try{const t=await(await fetch(s.src)).text();const m=t.match(/\\/\\/# sourceMappingURL=(.+)/);if(m){const mapUrl=new URL(m[1].trim(),s.src).href;const ok=(await fetch(mapUrl,{method:'HEAD'})).ok;res.push({script:s.src,map:mapUrl,accessible:ok});}}catch(e){}}return res;})()"}, {"id": "enum-csp", "cat": "Recon", "title": "CSP Parser & Gap Analysis", "desc": "Parse Content-Security-Policy and highlight weak directives (unsafe-inline, wildcard).", "risk": "read-only", "code": "(()=>{const csp=document.querySelector('meta[http-equiv=\"Content-Security-Policy\"]')?.content||'HEADER-ONLY (check devtools)';if(typeof csp!=='string')return csp;const weak=[];if(/'unsafe-inline'/.test(csp))weak.push('unsafe-inline allows injected script');if(/'unsafe-eval'/.test(csp))weak.push('unsafe-eval');if(/\\*\\.?\\s/.test(csp)||csp.includes('* '))weak.push('wildcard source');if(!/script-src/.test(csp))weak.push('NO script-src directive');if(/data:/.test(csp))weak.push('data: URIs allowed');return{raw:csp,weaknesses:weak};})()"}, {"id": "hook-fetch", "cat": "Traffic Hooks", "title": "Fetch Interceptor Logger", "desc": "Wrap fetch to log URLs, methods, headers, bodies of all requests to the console.", "risk": "instrumentation", "code": "(window.__origFetch=fetch,fetch=async(...a)=>{const[url,opt]=a;console.log('%c[REQ]', 'color:#4af',(opt?.method||'GET'),url, opt?.body||'');const r=await __origFetch(...a);const cl=r.clone();cl.text().then(t=>console.log('%c[RES]','color:#fa4',url,t.slice(0,500)));return r;},console.log('fetch hooked'))"}, {"id": "hook-xhr", "cat": "Traffic Hooks", "title": "XHR Interceptor Logger", "desc": "Wrap XMLHttpRequest open/send to capture API traffic including legacy endpoints.", "risk": "instrumentation", "code": "(window.__ox=XMLHttpRequest.prototype.open,window.__os=XMLHttpRequest.prototype.send,XMLHttpRequest.prototype.open=function(m,u,...r){this.__u=u;this.__m=m;return __ox.call(this,m,u,...r);},XMLHttpRequest.prototype.send=function(b){this.addEventListener('load',()=>console.log('%c[XHR]','color:#4af',this.__m,this.__u,'\\nBODY:',b,'\\nRESP:',this.responseText.slice(0,500)));return __os.call(this,b);},console.log('XHR hooked'))"}, {"id": "hook-ws", "cat": "Traffic Hooks", "title": "WebSocket Sniffer", "desc": "Wrap WebSocket to log messages sent/received (real-time API discovery on live socket apps).", "risk": "instrumentation", "code": "(window.__WS=WebSocket,window.WebSocket=function(u,p){const ws=new __WS(u,p);console.log('%c[WS open]','color:#4fa',u);ws.addEventListener('message',e=>console.log('%c[WS <-]','color:#fa4',e.d const state={cat:'All',q:'',risk:'ALL',queue:[],report:null};
const RISK_CLASS={'read-only':'b-read','instrumentation':'b-instr','active (requests)':'b-active','active (payload)':'b-payload','utility':'b-util'};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
function copy(text,msg){navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg);});}
function byId(id){return SNIPPETS.find(x=>x.id===id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ---- capture wrapper: logs result (sync or promise) into __IRX ---- */
function captureWrap(code,title){
  const errT=JSON.stringify(title+' — ERROR');
  return "(()=>{try{const __r=("+code+");const fin=v=>{if(window.__IRX)window.__IRX.log("+JSON.stringify(title)+",v);return v;};if(__r&&typeof __r.then==='function'){__r.then(fin).catch(e=>{if(window.__IRX)window.__IRX.log("+errT+",String(e),'high');console.error(e);});return __r;}return fin(__r);}catch(e){if(window.__IRX)window.__IRX.log("+errT+",String(e),'high');throw e;}})()";
}
function copySnippet(id){copy(byId(id).code,byId(id).title+' — copied');}
function copyCapture(id){copy(captureWrap(byId(id).code,byId(id).title),byId(id).title+' — copied w/ capture');}

function cats(){const all=[...new Set(SNIPPETS.map(s=>s.cat))];const el=document.getElementById('cats');
  el.innerHTML=['All',...all].map(c=>{const n=c==='All'?SNIPPETS.length:SNIPPETS.filter(s=>s.cat===c).length;
  return `<div class="cat ${state.cat===c?'active':''}" onclick="setCat('${c}')">${c}<span class="count">${n}</span></div>`;}).join('');}
function setCat(c){state.cat=c;cats();render();}
function setRisk(r){state.risk=r;document.getElementById('modeBtn').textContent='risk: '+r;render();}
document.getElementById('modeBtn').onclick=()=>{const order=['ALL','read-only','instrumentation','active (requests)','active (payload)','utility'];setRisk(order[(order.indexOf(state.risk)+1)%order.length]);};
document.getElementById('search').oninput=e=>{state.q=e.target.value.toLowerCase();render();};

function filtered(){return SNIPPETS.filter(s=>{
  if(state.cat!=='All'&&s.cat!==state.cat)return false;
  if(state.risk!=='ALL'&&s.risk!==state.risk)return false;
  if(state.q&&!(s.title+s.desc+s.code+s.id).toLowerCase().includes(state.q))return false;
  return true;});}
function render(){
  document.getElementById('list').innerHTML=filtered().map(s=>`
    <div class="card">
      <div class="card-head">
        <span class="card-title">${esc(s.title)}</span>
        <span class="badge ${RISK_CLASS[s.risk]||'b-util'}">${s.risk}</span>
        <span class="cat-tag">${s.cat} · ${s.id}</span>
      </div>
      <div class="card-desc">${esc(s.desc)}</div>
      <div class="code-block">${esc(s.code)}</div>
      <div class="card-actions">
        <button class="act primary" onclick="copySnippet('${s.id}')">copy</button>
        <button class="act cap" onclick="copyCapture('${s.id}')" title="wraps result into __IRX report">copy + capture</button>
        <button class="act" onclick="addToBuilder('${s.id}')">+ builder</button>
      </div>
    </div>`).join('')||'<div class="empty">no snippets match</div>';
}

/* ---- mission builder ---- */
function addToBuilder(id){if(!state.queue.includes(id)){state.queue.push(id);renderBuilder();toast('added to mission');}else toast('already queued');}
function removeFromBuilder(i){state.queue.splice(i,1);renderBuilder();}
function moveBuilder(i,dir){const j=i+dir;if(j<0||j>=state.queue.length)return;[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]];renderBuilder();}
function renderBuilder(){
  document.getElementById('builderList').innerHTML=state.queue.length?state.queue.map((id,i)=>{const s=byId(id);
    return `<div class="b-item"><span class="t">${i+1}. ${esc(s.title)}</span>
      <button class="up" onclick="moveBuilder(${i},-1)">▲</button>
      <button class="up" onclick="moveBuilder(${i},1)">▼</button>
      <button onclick="removeFromBuilder(${i})">✕</button></div>`;}).join(''):'<div class="empty">queue snippets to chain them<br>bootstrap auto-injects · steps auto-capture</div>';
  updatePreview();}
function chained(){
  const steps=state.queue.map((id,i)=>{const s=byId(id);
    return "console.log('%c[step "+(i+1)+"/"+state.queue.length+"] "+s.title.replace(/'/g,'')+"','color:#4a9df0');\ntry{\n"+captureWrap(s.code,s.title)+"\n}catch(e){console.error('step "+(i+1)+" failed:',e)}";});
  return "(async()=>{\nconsole.log('%c[INJECTRIX] mission start','color:#4af0c0;font-weight:bold');\n"+byId('zz-irx-bootstrap').code+"\n"+steps.join('\n')+"\nconsole.log('%c[INJECTRIX] complete — run __IRX.md() or __IRX.copy()','color:#4af0c0;font-weight:bold');\n})();";}
function updatePreview(){const p=document.getElementById('builderPreview');p.textContent=state.queue.length?chained().slice(0,700)+(chained().length>700?'\\n…':''):'';}
document.getElementById('exportBtn').onclick=()=>{if(state.queue.length)copy(chained(),'chained payload copied — paste in target console');else toast('queue is empty');};
document.getElementById('bmBtn').onclick=()=>{if(state.queue.length)copy('javascript:'+encodeURIComponent(chained()),'bookmarklet copied');else toast('queue is empty');};
document.getElementById('clearBtn').onclick=()=>{state.queue=[];renderBuilder();};

/* ---- tabs ---- */
function switchTab(t){
  document.getElementById('tabMission').classList.toggle('active',t==='mission');
  document.getElementById('tabReport').classList.toggle('active',t==='report');
  document.getElementById('missionPane').classList.toggle('active',t==='mission');
  document.getElementById('reportPane').classList.toggle('active',t==='report');}

/* ---- report engine ---- */
const SEVS=['info','note','low','medium','high','critical'];
function loadReport(){
  let r;try{r=JSON.parse(document.getElementById('repIn').value);}catch(e){toast('invalid JSON');return;}
  if(!r||!Array.isArray(r.findings)){toast('no findings array found');return;}
  state.report=r;renderReport();toast('report loaded — '+r.findings.length+' findings');}
function renderReport(){
  const r=state.report;
  document.getElementById('repMeta').style.display='block';
  document.getElementById('repMeta').innerHTML='<b>target:</b> '+esc(r.meta?.url||'?')+'<br><b>captured:</b> '+esc(r.meta?.ts||'?')+'<br><b>findings:</b> '+r.findings.length;
  document.getElementById('findings').innerHTML=r.findings.map((f,i)=>`
    <div class="finding">
      <div class="f-head">
        <span class="f-title">${i+1}. ${esc(f.title)}</span>
        <select class="sev-select" onchange="state.report.findings[${i}].severity=this.value">
          ${SEVS.map(s=>`<option ${s===(f.severity||'info')?'selected':''}>${s}</option>`).join('')}
        </select>
        <span class="f-time">${esc(f.ts||'')}</span>
      </div>
      <div class="f-data">${esc(f.data||'')}</div>
      <input class="f-note" placeholder="analyst note…" value="${esc(f.analystNote||'')}" oninput="state.report.findings[${i}].analystNote=this.value">
    </div>`).join('');}
function merged(){const r=state.report;return r;}
function exportMD(){
  if(!state.report)return toast('load a report first');
  const r=state.report;
  const L=['# INJECTRIX Recon Report','','| Field | Value |','|---|---|','| Target | '+(r.meta?.url||'?')+' |','| Agent | '+(r.meta?.ua||'?')+' |','| Captured | '+(r.meta?.ts||'?')+' |','| Findings | '+r.findings.length+' |',''];
  r.findings.forEach((f,i)=>{L.push('## '+(i+1)+'. '+f.title,'','severity: `'+f.severity+'`  time: `'+(f.ts||'')+'`','','```',f.data||'','```');if(f.analystNote)L.push('','> **Analyst note:** '+f.analystNote);L.push('');});
  copy(L.join('\n'),'markdown report copied');}
function exportHTML(){
  if(!state.report)return toast('load a report first');
  const r=state.report;const e=esc;
  const rows=r.findings.map((f,i)=>'<tr><td>'+(i+1)+'</td><td>'+e(f.ts||'')+'</td><td class="s">'+e(f.severity)+'</td><td><b>'+e(f.title)+'</b>'+(f.analystNote?'<p class="note">NOTE: '+e(f.analystNote)+'</p>':'')+'<pre>'+e(f.data||'')+'</pre></td></tr>').join('');
  copy('<!DOCTYPE html><html><head><meta charset=utf-8><title>IRX Report</title><style>body{font-family:monospace;background:#0a0c10;color:#c8d3e0;padding:2rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #232a36;padding:8px;vertical-align:top}pre{white-space:pre-wrap;max-width:640px;font-size:11px;color:#9fb2c8}.s{font-weight:bold}.note{color:#f0b44a}h1{color:#4af0c0}</style></head><body><h1>INJECTRIX Recon Report</h1><p>Target: '+e(r.meta?.url||'?')+'<br>Captured: '+(r.meta?.ts||'?')+'</p><table><tr><th>#</th><th>time</th><th>sev</th><th>finding</th></tr>'+rows+'</table></body></html>','HTML report copied — save as .html');}
function exportJSON(){if(!state.report)return toast('load a report first');copy(JSON.stringify(state.report,null,1),'JSON copied');}
document.getElementById('loadRepBtn').onclick=loadReport;
document.getElementById('saveRepBtn').onclick=()=>{if(!state.report)return toast('load a report first');
  const lib=JSON.parse(localStorage.getItem('irx_reports')||'[]');
  lib.unshift({name:(state.report.meta?.url||'report')+' @ '+(state.report.meta?.ts||''),data:state.report});
  localStorage.setItem('irx_reports',JSON.stringify(lib.slice(0,30)));listReports();toast('saved to library');};
document.getElementById('expMdBtn').onclick=exportMD;
document.getElementById('expHtmlBtn').onclick=exportHTML;
document.getElementById('expJsonBtn').onclick=exportJSON;
function listReports(){
  const lib=JSON.parse(localStorage.getItem('irx_reports')||'[]');
  document.getElementById('savedReports').innerHTML=lib.length?lib.map((r,i)=>
    `<div class="sv-item"><span class="t" onclick="loadSaved(${i})">${esc(r.name)}</span><button onclick="delSaved(${i})">✕</button></div>`).join(''):'<div class="empty">no saved reports</div>';}
function loadSaved(i){const lib=JSON.parse(localStorage.getItem('irx_reports')||'[]');state.report=lib[i].data;renderReport();toast('loaded from library');}
function delSaved(i){const lib=JSON.parse(localStorage.getItem('irx_reports')||'[]');lib.splice(i,1);localStorage.setItem('irx_reports',JSON.stringify(lib));listReports();}

const TEMPLATES=[
  {name:'Full Recon Sweep',queue:['zz-irx-bootstrap','enum-tech','enum-storage','enum-sourcemaps','enum-csp','enum-frames','util-netlog','auth-jwt-decode','dom-sinks']},
  {name:'XSS / mXSS Hunt (post-flood)',queue:['zz-irx-bootstrap','adv-sink-scan','mxss-roundtrip','mxss-namespace','inj-proto-poll','inj-dom-clobber','dom-params']},
  {name:'XSS Hunt — phase 1 (run flood, reload, then load phase 2)',queue:['adv-canary-flood']},
  {name:'Auth Audit',queue:['zz-irx-bootstrap','auth-jwt-decode','auth-cookie-flags','auth-csrf-scan','adv-cors-check','adv-jwt-confuse']},
  {name:'XS-Leak Kit',queue:['zz-irx-bootstrap','adv-sw-poison','adv-frame-oracle','eg-blind','eg-domain']},
  {name:'API Surface Map',queue:['zz-irx-bootstrap','hook-fetch','hook-xhr','auto-api-map','enum-endpoints','adv-graphql-probe']},
  {name:'PP + Clobber',queue:['zz-irx-bootstrap','adv-pp-gadgets','inj-dom-clobber','inj-template','adv-dangling-markup']},
  {name:'Automation Recon',queue:['zz-irx-bootstrap','auto-headless-hints','auto-param-miner','auto-route-walk','auto-dom-diff']}
];
function renderTemplates(){document.getElementById('tplSelect').innerHTML=TEMPLATES.map((t,i)=>'<option value="'+i+'">'+t.name+'</option>').join('');}
function loadTemplate(){const t=TEMPLATES[+document.getElementById('tplSelect').value];state.queue=[...t.queue];renderBuilder();
  const hasReload=state.queue.some(id=>byId(id).code.includes('reload'));
  toast(hasReload?'template loaded — RELOADS PAGE: run remaining steps after reload':'template loaded: '+t.queue.length+' steps');}
cats();render();renderBuilder();listReports();
</script>
